<!DOCTYPE html>
<html lang="zh-CN" data-theme="arc-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WePaste</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f4f3ff;
      color: #0f172a;
      transition: background 0.2s ease, color 0.2s ease;
    }

    html[data-theme="arc-deck"] body {
      background: #12111d;
      color: #f5f3ff;
    }

    /* =========================================================================
       浏览器独立预览顶栏（仅非 Tauri 环境显示）
       ========================================================================= */
    .preview-toolbar {
      display: none;
      width: 100%;
      background: rgba(15, 17, 26, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f4f4f5;
      padding: 10px 18px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .preview-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preview-label {
      color: #a1a1aa;
      font-weight: 600;
      font-size: 11.5px;
    }

    .preview-btn {
      background: #1f2230;
      color: #d4d4d8;
      border: 1px solid #34384c;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preview-btn:hover {
      background: #2c3144;
      color: #ffffff;
    }

    .preview-btn.active {
      background: linear-gradient(135deg, #6366f1, #10b981);
      color: #ffffff;
      border-color: transparent;
      font-weight: 700;
    }

    body.is-browser-preview {
      background: #0e1017 !important;
      padding-bottom: 56px;
    }

    body.is-browser-preview .preview-toolbar {
      display: flex;
    }

    body.is-browser-preview .single-stage {
      margin-top: 28px;
      width: 436px;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .gallery-grid {
      display: none;
      width: 100%;
      max-width: 960px;
      padding: 28px 24px;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 28px;
      align-items: start;
      justify-items: center;
    }

    body.is-gallery-mode .single-stage {
      display: none;
    }

    body.is-gallery-mode .gallery-grid {
      display: grid;
    }

    .gallery-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .gallery-caption {
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      background: #1c1f2e;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .gallery-frame {
      width: 436px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .single-stage {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.is-browser-preview .single-stage {
      width: 436px;
      height: auto;
      min-height: auto;
    }

    /* =========================================================================
       顶部明暗切换胶囊（App 内置 & 预览通用）
       ========================================================================= */
    .arc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .arc-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .arc-logo-orb {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981 0%, #6366f1 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .arc-brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .arc-brand-sub {
      font-size: 10.5px;
      opacity: 0.62;
      margin-top: 1px;
    }

    .inline-style-bar {
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      -webkit-app-region: no-drag;
    }

    .inline-style-btn {
      border: none;
      background: transparent;
      color: inherit;
      opacity: 0.65;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .inline-style-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .theme-arc-deck .inline-style-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .win-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(128, 128, 128, 0.2);
      background: rgba(128, 128, 128, 0.1);
      color: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .win-close-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }

    .is-windows-os.theme-arc-deck,
    .is-windows-os.theme-arc-light {
      padding-top: 18px;
    }

    /* =========================================================================
       Arc Split-Deck 暗色版（theme-arc-deck）
       ========================================================================= */
    .theme-arc-deck {
      background:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.16) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.2) 0px, transparent 55%),
        linear-gradient(155deg, #161324 0%, #0e131f 52%, #0c191e 100%);
      color: #f5f3ff;
      padding: 38px 18px 18px 18px;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.is-browser-preview .theme-arc-deck {
      padding: 20px 18px 18px 18px;
      height: 620px;
      min-height: 620px;
    }

    /* 严格左右对称的三列网格连接桥 */
    .arc-bridge-bar {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 20px;
      padding: 11px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .arc-node {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .arc-node.left {
      justify-self: start;
      cursor: pointer;
      padding: 3px 6px 3px 3px;
      margin: -3px -6px -3px -3px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }

    .arc-node.left:hover {
      background: rgba(128, 128, 128, 0.12);
    }

    .arc-node.right {
      justify-self: end;
      text-align: right;
    }

    .arc-node-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .arc-node-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arc-node-avatar {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.09);
      flex-shrink: 0;
    }

    .arc-node-sub {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.25;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arc-beam {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .arc-beam::before,
    .arc-beam::after {
      content: "";
      width: 14px;
      height: 2px;
      border-radius: 999px;
    }

    .arc-beam::before {
      background: linear-gradient(90deg, transparent, #10b981);
    }

    .arc-beam::after {
      background: linear-gradient(90deg, #6366f1, transparent);
    }

    .arc-beam-tag {
      background: #151828;
      border: 1px solid rgba(129, 140, 248, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      color: #a5b4fc;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .arc-beam-tag:hover {
      transform: scale(1.04);
    }

    .arc-pod-rx {
      background: linear-gradient(160deg, rgba(16, 185, 129, 0.16) 0%, rgba(6, 78, 59, 0.24) 100%);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 22px;
      padding: 14px 15px;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .arc-pod-tx {
      background: linear-gradient(160deg, rgba(99, 102, 241, 0.18) 0%, rgba(49, 46, 129, 0.26) 100%);
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 22px;
      padding: 14px 15px;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .arc-badge-rx {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #6ee7b7;
      text-transform: uppercase;
    }

    .arc-badge-tx {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #a5b4fc;
      text-transform: uppercase;
    }

    .arc-pod-title {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .arc-glass-box {
      background: rgba(9, 11, 19, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.55;
      color: #f1f5f9;
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      justify-content: center;
      -webkit-user-select: text;
      user-select: text;
    }

    .arc-rx-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6ee7b7;
      opacity: 0.88;
      flex-shrink: 0;
    }

    .arc-tx-meta {
      font-size: 11px;
      color: #c7d2fe;
      font-weight: 600;
    }

    .arc-pull-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .arc-pull-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .arc-action-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid rgba(165, 180, 252, 0.4);
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
      transition: filter 0.15s ease, transform 0.12s ease;
      flex-shrink: 0;
    }

    .arc-action-btn:hover {
      filter: brightness(1.07);
    }

    .arc-action-btn:active {
      transform: scale(0.99);
    }

    /* =========================================================================
       Arc Split-Deck 亮色版（theme-arc-light）
       ========================================================================= */
    .theme-arc-light {
      background:
        radial-gradient(at 0% 0%, rgba(167, 243, 208, 0.45) 0px, transparent 52%),
        radial-gradient(at 100% 100%, rgba(199, 210, 254, 0.55) 0px, transparent 55%),
        linear-gradient(160deg, #f5f3ff 0%, #f0fdf4 50%, #f8fafc 100%);
      color: #0f172a;
      padding: 38px 18px 18px 18px;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.is-browser-preview .theme-arc-light {
      padding: 20px 18px 18px 18px;
      height: 620px;
      min-height: 620px;
    }

    .theme-arc-light .arc-bridge-bar {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .theme-arc-light .arc-node-avatar {
      background: #f1f5f9;
      border: 1px solid rgba(15, 23, 42, 0.06);
    }

    .theme-arc-light .arc-node-sub {
      color: #64748b;
    }

    .theme-arc-light .arc-beam-tag {
      background: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.14);
    }

    .theme-arc-light .arc-pod-rx {
      background: linear-gradient(160deg, rgba(209, 250, 229, 0.72) 0%, rgba(236, 253, 245, 0.92) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.07);
    }

    .theme-arc-light .arc-pod-tx {
      background: linear-gradient(160deg, rgba(224, 231, 255, 0.75) 0%, rgba(238, 242, 255, 0.94) 100%);
      border: 1px solid rgba(99, 102, 241, 0.28);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.08);
    }

    .theme-arc-light .arc-badge-rx {
      color: #047857;
    }

    .theme-arc-light .arc-badge-tx {
      color: #4338ca;
    }

    .theme-arc-light .arc-glass-box {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.08);
      color: #1e293b;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .theme-arc-light .arc-rx-footer {
      color: #065f46;
      opacity: 0.9;
    }

    .theme-arc-light .arc-tx-meta {
      color: #4338ca;
    }

    .theme-arc-light .arc-pull-btn {
      background: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #065f46;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.1);
    }

    .theme-arc-light .arc-pull-btn:hover {
      background: #ecfdf5;
    }

    .theme-arc-light .arc-action-btn {
      border: 1px solid rgba(79, 70, 229, 0.3);
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
    }

    /* =========================================================================
       配对抽屉、横幅提示与图片缩略图
       ========================================================================= */
    .pair-drawer-box {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(128, 128, 128, 0.1);
      border: 1px dashed rgba(128, 128, 128, 0.35);
    }

    .pair-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .pair-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid rgba(128, 128, 128, 0.35);
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-align: center;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .theme-arc-deck .pair-input {
      background: rgba(0, 0, 0, 0.35);
      color: #f8fafc;
    }

    /* 未配对状态专属主卡片（充满整个窗口，不显示下方收发舱） */
    .arc-pair-hero {
      flex: 1;
      border-radius: 24px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(160deg, rgba(16, 185, 129, 0.14) 0%, rgba(99, 102, 241, 0.16) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .theme-arc-light .arc-pair-hero {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.88) 0%, rgba(238, 242, 255, 0.92) 100%);
      border: 1px solid rgba(99, 102, 241, 0.24);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .arc-pair-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 26px;
    }

    .arc-pair-icon-box {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .theme-arc-light .arc-pair-icon-box {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .arc-pair-steps {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .theme-arc-light .arc-pair-steps {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.07);
      color: #334155;
    }

    .arc-pair-input-lg {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1.5px solid rgba(99, 102, 241, 0.45);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.38em;
      text-align: center;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.12);
    }

    .theme-arc-deck .arc-pair-input-lg {
      background: rgba(9, 11, 19, 0.72);
      border-color: rgba(129, 140, 248, 0.5);
      color: #f8fafc;
    }

    .arc-pair-submit-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.32);
      transition: filter 0.15s ease, transform 0.12s ease;
    }

    .arc-pair-submit-btn:hover {
      filter: brightness(1.06);
    }

    .banner-notice {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .banner-notice.error {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .clip-img-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .clip-img-thumb {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid rgba(128, 128, 128, 0.2);
      background: rgba(0, 0, 0, 0.04);
      display: block;
    }
  </style>
</head>
<body>
  <!-- 仅在浏览器独立打开时出现的顶栏 -->
  <div class="preview-toolbar">
    <div class="preview-group">
      <span class="preview-label">🎨 Arc 主题：</span>
      <button class="preview-btn active" id="tb-theme-arc-light" data-action="switch-theme" data-arg="arc-light">☀️ Arc Split-Deck 亮色版</button>
      <button class="preview-btn" id="tb-theme-arc-deck" data-action="switch-theme" data-arg="arc-deck">🌙 Arc Split-Deck 暗色版</button>
      <button class="preview-btn" id="tb-gallery" data-action="toggle-gallery">✨ 亮色 / 暗色同屏对比</button>
    </div>
    <div class="preview-group">
      <span class="preview-label">🔄 数据状态：</span>

      localClipboardImageDataUrl: null,
      localClipboardKind: "文字 · 61 字",
      banner: null,
      bannerType: "info",
      devices: [
        { name: "vivo V2505A", uin: "8848135147122979" },
        { name: "iPhone 14 Pro Max", uin: "3503941978415293" },
        { name: "iPad", uin: "8848070718651328" },
        { name: "Joey’s Mac mini", uin: "8848117964639984" }

    const DEMO_PHONE_IMG =
      "data:image/svg+xml;utf8," +

        '<rect x="32" y="56" width="120" height="10" rx="4" fill="#818cf8"/>' +
        '<rect x="32" y="76" width="188" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>' +

      );

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderRxContent(emptyPlaceholder) {
      if (appState.lastImageDataUrl) {
        return `
          <div class="clip-img-frame">
            <img class="clip-img-thumb" src="${appState.lastImageDataUrl}" alt="手机同步图片" />
          </div>
        `;
      }
      if (appState.lastPreview) {
        return escapeHtml(appState.lastPreview);
      }
      return emptyPlaceholder;
    }

    function renderTxContent(emptyPlaceholder) {
      if (appState.localClipboardImageDataUrl) {
        return `
          <div class="clip-img-frame">
            <img class="clip-img-thumb" src="${appState.localClipboardImageDataUrl}" alt="电脑当前剪贴板图片" />
          </div>
        `;
      }
      if (appState.localClipboardPreview) {
        return escapeHtml(appState.localClipboardPreview);
      }
      return emptyPlaceholder;
    }

    function inlineSwitcherHtml(themeKey, show) {
      if (!show) return "";
      const items = [
        { k: "arc-light", label: "☀️ 亮色" },
        { k: "arc-deck", label: "🌙 暗色" }
      ];
      return `
        <div class="inline-style-bar">
          ${items
            .map(
              it =>
                `<button class="inline-style-btn ${themeKey === it.k ? "active" : ""}" data-action="switch-theme" data-arg="${it.k}">${it.label}</button>`
            )
            .join("")}
        </div>
      `;
    }

    function renderPairManagementCard(themeKey) {
      const deviceChips = (appState.devices || [])
        .map(
          (d, idx) =>
            `<button type="button" data-action="select-peer" data-arg="${escapeHtml(d.name)}" title="点击设为主显示设备" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:11.5px;color:inherit;font-weight:${idx === 0 ? "700" : "500"};background:${idx === 0 ? "rgba(16,185,129,0.22)" : "rgba(128,128,128,0.14)"};border:1px solid ${idx === 0 ? "rgba(16,185,129,0.5)" : "rgba(128,128,128,0.24)"};">${idx === 0 ? "📱 主设备 · " : ""}${escapeHtml(d.name)}</button>`
        )
        .join("");

      const updateBtnHtml = appState.updateAvailable
        ? `<button class="arc-pull-btn" data-action="install-update" style="background:rgba(16,185,129,0.22);border-color:rgba(16,185,129,0.5);">🚀 一键升级 v${escapeHtml(appState.updateAvailable)}</button>`
        : `<button class="arc-pull-btn" data-action="check-update">${appState.checkingUpdate ? "⏳ 检查中..." : "🔄 检查更新"}</button>`;

      return `
        <section class="arc-pair-hero" style="justify-content:space-between; padding:18px; gap:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div class="arc-badge-rx">DEVICE & SETTINGS · 设备与偏好设置</div>
              <div style="font-size:14.5px; font-weight:800; margin-top:2px;">互通设备群组（${appState.devices.length} 台）</div>
            </div>
            <button class="arc-pull-btn" data-action="toggle-pair-drawer">✕ 返回面板</button>
          </div>

          <div class="arc-pair-steps" style="gap:7px; padding:11px 13px;">
            <div style="font-size:11px; opacity:0.8;">点击任意设备可将其设为顶部主显示手机：</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              ${deviceChips}
            </div>
          </div>

          <div class="arc-pair-steps" style="flex-direction:row; justify-content:space-between; align-items:center; padding:10px 13px;">
            <div style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600;">
              <span>⚙️ 系统偏好 · v${escapeHtml(appState.appVersion || "0.1.0")}</span>
            </div>
            <div style="display:flex; align-items:center; gap:7px;">
              <button class="arc-pull-btn" data-action="toggle-autostart">
                ${appState.autostart ? "✅ 开机自启 ON" : "⬜ 开机自启 OFF"}
              </button>
              ${updateBtnHtml}
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:11.5px; font-weight:600; opacity:0.85;">
              换绑新手机：输入手机微信输入法的 6 位配对码后点「确认配对」
            </div>
            <div style="display:flex; gap:8px;">
              <input
                class="pair-input"
                id="pairCodeInput-${themeKey}"
                type="text"
                maxlength="6"
                placeholder="000000"
                inputmode="numeric"
                value="${escapeHtml(appState.pairCodeDraft || "")}"
                style="font-size:18px; padding:9px 12px;"
              />
              <button class="arc-pair-submit-btn" style="width:auto; padding:9px 18px; white-space:nowrap;" data-action="submit-pair" data-arg="${themeKey}">
                ${appState.pairingInProgress ? "⏳ 等待确认..." : "🔗 确认配对"}
              </button>
            </div>
          </div>
        </section>
      `;
    }

    function renderArcDeck(themeKey, showSwitcher) {
      const isLight = themeKey === "arc-light";
      const isWindows = appState.platform === "windows";
      const wrapClass = `${isLight ? "theme-arc-light" : "theme-arc-deck"}${isWindows ? " is-windows-os" : ""}`;
      const primaryPhone = appState.devices[0]?.name || "未关联手机";
      const rxText = renderRxContent(`<span style="opacity:0.48;font-style:italic;">等待手机复制新内容...</span>`);
      const txText = renderTxContent(`<span style="opacity:0.48;font-style:italic;">电脑当前剪贴板为空</span>`);
      const closeBtnHtml = `<button class="win-close-btn" data-action="close-window" title="隐藏到托盘">✕</button>`;

      // 未连接 / 未配对状态：不展示下方的拉取和发送模块，直接展示全屏配对主面板
      if (!appState.paired) {
        return `
          <main class="${wrapClass}">
            <header class="arc-header">
              <div class="arc-brand">
                <div class="arc-logo-orb">W</div>
                <div>
                  <div class="arc-brand-title">WePaste</div>
                  <div class="arc-brand-sub">本机节点 ${escapeHtml(appState.localName)} · 未绑定设备</div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                ${inlineSwitcherHtml(themeKey, showSwitcher)}
                ${closeBtnHtml}
              </div>
            </header>

            ${appState.banner ? `<div class="banner-notice ${appState.bannerType === "error" ? "error" : ""}">${escapeHtml(appState.banner)}</div>` : ""}

            <section class="arc-pair-hero">
              <div class="arc-pair-icons">
                <div class="arc-pair-icon-box">📱</div>
                <span style="font-size:18px; opacity:0.65;">─── 🔗 ───</span>
                <div class="arc-pair-icon-box">💻</div>
              </div>

              <div style="text-align:center;">
                <div style="font-size:18px; font-weight:800; letter-spacing:-0.02em;">配对连接手机微信输入法</div>
                <div style="font-size:12px; opacity:0.7; margin-top:5px;">
                  无需切换电脑输入法，即可双向同步手机与电脑剪贴板
                </div>
              </div>

              <div class="arc-pair-steps">
                <div><strong>1.</strong> 打开手机 <strong>「微信输入法」App →「跨设备复制粘贴」</strong></div>
                <div><strong>2.</strong> 在下方输入框填入手机显示的 <strong>6 位数字配对码</strong></div>
                <div><strong>3.</strong> 点击 <strong>「确认配对」</strong> 按钮后，在手机弹窗点「连接」</div>
              </div>

              <div style="display:flex; flex-direction:column; gap:12px;">
                <input
                  class="pair-input arc-pair-input-lg"
                  id="pairCodeInput-${themeKey}"
                  type="text"
                  maxlength="6"
                  placeholder="000000"
                  inputmode="numeric"
                  value="${escapeHtml(appState.pairCodeDraft || "")}"
                />
                <button class="arc-pair-submit-btn" data-action="submit-pair" data-arg="${themeKey}">
                  ${appState.pairingInProgress ? "⏳ 已发送配对请求，请在手机上点确认..." : "🔗 确认配对"}
                </button>
              </div>
            </section>
          </main>
        `;
      }

      return `
        <main class="${wrapClass}">
          <header class="arc-header">
            <div class="arc-brand">
              <div class="arc-logo-orb">W</div>
              <div>
                <div class="arc-brand-title">WePaste</div>
                <div class="arc-brand-sub">本机节点 ${escapeHtml(appState.localName)} · v${escapeHtml(appState.appVersion || "0.1.0")}</div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              ${appState.updateAvailable ? `<button class="arc-pull-btn" data-action="install-update" style="padding:4px 9px;font-size:10.5px;background:rgba(16,185,129,0.22);border-color:rgba(16,185,129,0.5);">🚀 新版 v${escapeHtml(appState.updateAvailable)}</button>` : ""}
              ${inlineSwitcherHtml(themeKey, showSwitcher)}
              ${closeBtnHtml}
            </div>
          </header>

          <!-- 顶部严格对称的三列连接光桥 -->
          <div class="arc-bridge-bar">
            <div class="arc-node left" data-action="toggle-pair-drawer" title="点击管理关联设备或重新配对">
              <div class="arc-node-avatar">📱</div>
              <div class="arc-node-text">
                <div class="arc-node-title">${escapeHtml(primaryPhone)}</div>
                <div class="arc-node-sub">手机端 · ${appState.devices.length} 台互通</div>
              </div>
            </div>
            <div class="arc-beam">
              <span class="arc-beam-tag" data-action="toggle-auto-sync">
                ${appState.autoSync ? "⚡ 实时同步 ON" : "⏸ 已暂停监听"}
              </span>
            </div>
            <div class="arc-node right">
              <div class="arc-node-text">
                <div class="arc-node-title">本机剪贴板</div>
                <div class="arc-node-sub">电脑端 · 直接 ⌘V</div>
              </div>
              <div class="arc-node-avatar">💻</div>
            </div>
          </div>

          ${appState.banner ? `<div class="banner-notice ${appState.bannerType === "error" ? "error" : ""}" style="flex-shrink:0;">${escapeHtml(appState.banner)}</div>` : ""}

          ${
            appState.showPairDrawer
              ? renderPairManagementCard(themeKey)
              : `
          <!-- 上太空舱：手机 -> 电脑（薄荷绿舱） -->
          <section class="arc-pod-rx">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
              <div>
                <div class="arc-badge-rx">01 // 从手机接收 · 手机 ──▶ 电脑</div>
                <div class="arc-pod-title">最近从手机收到的剪贴板</div>
              </div>
              <button class="arc-pull-btn" data-action="manual-pull">立即拉取</button>
            </div>
            <div class="arc-glass-box">${rxText}</div>
            <div class="arc-rx-footer">
              <span>来源设备：${escapeHtml(appState.lastSource || "—")}</span>
              <span>${escapeHtml(appState.lastKind)} · ${escapeHtml(appState.lastTime)}</span>
            </div>
          </section>

          <!-- 下太空舱：电脑 -> 手机（星云紫舱） -->
          <section class="arc-pod-tx">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
              <div>
                <div class="arc-badge-tx">02 // 发给手机 · 电脑 ──▶ 手机</div>
                <div class="arc-pod-title">把电脑当前剪贴板发给手机</div>
              </div>
              <span class="arc-tx-meta">${escapeHtml(appState.localClipboardKind)}</span>
            </div>
            <div class="arc-glass-box">${txText}</div>
            <button class="arc-action-btn" data-action="push-clipboard">
              🚀 发送上面这条电脑剪贴板到手机 ──▶
            </button>
          </section>
          `
          }
        </main>
      `;
    }

    function render() {
      const activeEl = document.activeElement;
      const focusedInputId =
        activeEl && activeEl.classList && activeEl.classList.contains("pair-input")
          ? activeEl.id
          : null;
      const selStart = focusedInputId ? activeEl.selectionStart : null;
      const selEnd = focusedInputId ? activeEl.selectionEnd : null;

      document.documentElement.setAttribute("data-theme", currentTheme);

      ["arc-light", "arc-deck"].forEach(t => {
        const btn = document.getElementById(`tb-theme-${t}`);
        if (btn) btn.classList.toggle("active", !galleryMode && currentTheme === t);
      });
      const galBtn = document.getElementById("tb-gallery");
      if (galBtn) galBtn.classList.toggle("active", galleryMode);

      document.body.classList.toggle("is-gallery-mode", galleryMode);

      const stageEl = document.getElementById("singleStage");
      const gridEl = document.getElementById("galleryGrid");

      if (!galleryMode) {
        if (stageEl) {
          stageEl.innerHTML = renderArcDeck(currentTheme, true);
        }
      } else if (gridEl) {
        const themes = [
          { key: "arc-light", title: "☀️ Arc Split-Deck Light（流光双太空舱 · 亮色版）" },
          { key: "arc-deck", title: "🌙 Arc Split-Deck Dark（流光双太空舱 · 暗色版）" }
        ];
        gridEl.innerHTML = themes
          .map(
            t => `
            <div class="gallery-column">
              <div class="gallery-caption">${t.title}</div>
              <div class="gallery-frame">
                ${renderArcDeck(t.key, false)}
              </div>
            </div>`
          )
          .join("");
      }

      if (focusedInputId) {
        const nextInput = document.getElementById(focusedInputId);
        if (nextInput) {
          nextInput.focus();
          try {
            if (selStart !== null && selEnd !== null) {
              nextInput.setSelectionRange(selStart, selEnd);
            }
          } catch (_) {}
        }
      }
    }

    function switchTheme(theme) {
      galleryMode = false;
      currentTheme = theme;
      saveTheme(theme);
      render();
    }

    function toggleGalleryMode() {
      galleryMode = !galleryMode;
      render();
    }

    function togglePairDrawer() {
      appState.showPairDrawer = !appState.showPairDrawer;
      render();
    }

    async function invokeTauri(cmd, args = {}) {
      if (!isTauri) return null;
      return window.__TAURI_INTERNALS__.invoke(cmd, args);
    }

    async function refreshState(forceRender = false) {
      if (!isTauri) {
        render();
        return;
      }
      try {
        const state = await invokeTauri("get_app_state");
        if (state) {
          const nextJson = JSON.stringify(state);
          if (!forceRender && nextJson === lastServerStateJson) {
            return;
          }
          lastServerStateJson = nextJson;
          appState = { ...appState, ...state };
          render();
        }
      } catch (err) {
        appState.banner = `读取状态失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function toggleAutoSync() {
      const next = !appState.autoSync;
      appState.autoSync = next;
      render();
      if (isTauri) {
        await invokeTauri("set_auto_sync", { enabled: next });
        await refreshState(true);
      }
    }

    async function toggleAutostart() {
      const next = !appState.autostart;
      appState.autostart = next;
      render();
      if (isTauri) {
        try {
          const state = await invokeTauri("set_autostart", { enabled: next });
          if (state) {
            lastServerStateJson = JSON.stringify(state);
            appState = { ...appState, ...state };
            render();
          }
        } catch (err) {
          appState.banner = `设置开机自启失败：${err}`;
          appState.bannerType = "error";
          render();
        }
      }
    }

    async function selectPreferredPeer(name) {
      if (!name) return;
      if (!isTauri) {
        const idx = appState.devices.findIndex(d => d.name === name);
        if (idx > 0) {
          const [picked] = appState.devices.splice(idx, 1);
          appState.devices.unshift(picked);
        }
        appState.banner = `已将主显示设备切换为：${name}`;
        appState.bannerType = "info";
        render();
        return;
      }
      try {
        const state = await invokeTauri("set_preferred_peer", { name });
        if (state) {
          lastServerStateJson = JSON.stringify(state);
          appState = { ...appState, ...state };
          render();
        }
      } catch (err) {
        appState.banner = `切换主设备失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function checkUpdateNow() {
      if (!isTauri) {
        appState.banner = `预览模式：当前已是最新版本 v${appState.appVersion || "0.1.0"}。`;
        appState.bannerType = "info";
        render();
        return;
      }
      appState.checkingUpdate = true;
      render();
      try {
        const state = await invokeTauri("check_update");
        appState.checkingUpdate = false;
        if (state) {
          lastServerStateJson = JSON.stringify(state);
          appState = { ...appState, ...state };
        }
        render();
      } catch (err) {
        appState.checkingUpdate = false;
        appState.banner = `检查更新失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function installUpdateNow() {
      if (!isTauri) return;
      appState.installingUpdate = true;
      appState.banner = "正在下载并安装新版本，完成后将自动重启 WePaste...";
      appState.bannerType = "info";
      render();
      try {
        await invokeTauri("install_update");
      } catch (err) {
        appState.installingUpdate = false;
        appState.banner = `升级安装失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function manualPullNow() {
      if (!isTauri) {
        appState.banner = "预览模式：已模拟从手机拉取最新剪贴板并写入电脑剪贴板。";
        appState.bannerType = "info";
        render();
        return;
      }
      try {
        appState.banner = "正在从微信输入法云端拉取手机最新剪贴板...";
        appState.bannerType = "info";
        render();
        const state = await invokeTauri("pull_now");
        if (state) {
          lastServerStateJson = JSON.stringify(state);
          appState = { ...appState, ...state };
        }
        render();
      } catch (err) {
        appState.banner = `拉取失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function pushClipboardToPhone() {
      if (!isTauri) {
        appState.banner = "预览模式：已把「电脑当前剪贴板」发送给手机微信输入法。";
        appState.bannerType = "info";
        render();
        return;
      }
      try {
        appState.banner = "正在把电脑当前剪贴板发送给手机...";
        appState.bannerType = "info";
        render();
        const state = await invokeTauri("push_clipboard_to_phone");
        if (state) {
          lastServerStateJson = JSON.stringify(state);
          appState = { ...appState, ...state };
        }
        render();
      } catch (err) {
        appState.banner = `发送失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    async function submitPairCode(themeKey) {
      const inputEl = document.getElementById(`pairCodeInput-${themeKey}`);
      const code = (inputEl ? inputEl.value : appState.pairCodeDraft || "").trim();
      appState.pairCodeDraft = code;
      if (!/^\d{6}$/.test(code)) {
        appState.banner = "请输入手机微信输入法显示的 6 位数字配对码。";
        appState.bannerType = "error";
        render();
        return;
      }
      appState.pairingInProgress = true;
      appState.banner = `已发送配对请求（${code}），请在手机微信输入法弹窗中点「确认连接」...`;
      appState.bannerType = "info";
      render();

      if (!isTauri) {
        setTimeout(() => {
          appState.pairingInProgress = false;
          appState.paired = true;
          appState.showPairDrawer = false;
          appState.pairCodeDraft = "";
          appState.banner = "配对成功！已关联手机设备。";
          render();
        }, 1000);
        return;
      }

      try {
        const state = await invokeTauri("pair_device", { code });
        appState.pairingInProgress = false;
        appState.showPairDrawer = false;
        appState.pairCodeDraft = "";
        if (state) {
          lastServerStateJson = JSON.stringify(state);
          appState = { ...appState, ...state };
        }
        render();
      } catch (err) {
        appState.pairingInProgress = false;
        appState.banner = `配对失败：${err}`;
        appState.bannerType = "error";
        render();
      }
    }

    function setPreviewPreset(preset) {
      ["connected", "image", "unpaired"].forEach(k => {
        const b = document.getElementById(`tb-state-${k}`);
        if (b) b.classList.toggle("active", k === preset);
      });

      if (preset === "connected") {
        appState = {
          ...appState,
          paired: true,
          autoSync: true,
          showPairDrawer: false,
          banner: null,
          lastPreview: "我其实更倾向于走默认，更倾向于直接写系统剪贴板。",
          lastImageDataUrl: null,
          lastKind: "文字 · 24 字",
          lastSource: "vivo V2505A",
          lastTime: "08:10:25",
          localClipboardPreview: "https://github.com/mkdir700/wx-ime-sdk — 微信输入法跨设备剪贴板协议实现",
          localClipboardImageDataUrl: null,
          localClipboardKind: "文字 · 61 字",
          devices: [
            { name: "vivo V2505A", uin: "8848135147122979" },
            { name: "iPhone 14 Pro Max", uin: "3503941978415293" },
            { name: "Joey’s Mac mini", uin: "8848117964639984" }
          ]
        };
      } else if (preset === "image") {
        appState = {
          ...appState,
          paired: true,
          autoSync: true,
          showPairDrawer: false,
          banner: "已收到手机截图并直接写入电脑剪贴板（可直接 ⌘V 粘贴）",
          bannerType: "info",
          lastPreview: "1080×2400 (412 KB)",
          lastImageDataUrl: DEMO_PHONE_IMG,
          lastKind: "图片 · 1080×2400",
          lastSource: "vivo V2505A",
          lastTime: "08:31:02",
          localClipboardPreview: "2560×1440 像素",
          localClipboardImageDataUrl: DEMO_MAC_IMG,
          localClipboardKind: "图片 · 2560×1440"
        };
      } else if (preset === "unpaired") {
        appState = {
          ...appState,
          paired: false,
          autoSync: false,
          showPairDrawer: true,
          banner: null,
          bannerType: "info",
          lastPreview: "",
          lastImageDataUrl: null,
          lastKind: "—",
          lastSource: "—",
          lastTime: "暂无",
          localClipboardImageDataUrl: null,
          devices: []
        };
      }
      render();
    }

    // 显式挂载到 window 供按钮与 Tauri WebView 调用
    window.render = render;
    window.switchTheme = switchTheme;
    window.toggleGalleryMode = toggleGalleryMode;
    window.togglePairDrawer = togglePairDrawer;
    window.toggleAutoSync = toggleAutoSync;
    window.manualPullNow = manualPullNow;
    window.pushClipboardToPhone = pushClipboardToPhone;
    window.submitPairCode = submitPairCode;
    window.setPreviewPreset = setPreviewPreset;

    if (!window.__WEPASTE_BOOTED__) {
      window.__WEPASTE_BOOTED__ = true;

      // 任意非点击/非文本选择区域（顶部、四周边缘、卡片空白处）按下鼠标左键均可拖动窗口
      document.addEventListener("mousedown", e => {
        if (!isTauri || e.button !== 0) return;
        const interactive = e.target.closest(
          "button, input, textarea, a, [data-action], .arc-glass-box"
        );
        if (interactive) return;
        invokeTauri("start_window_drag");
      });

      // 实时保存配对码输入草稿，仅在用户主动点击「确认配对」按钮时才发送配对请求
      document.addEventListener("input", e => {
        if (e.target && e.target.classList && e.target.classList.contains("pair-input")) {
          appState.pairCodeDraft = e.target.value;
        }
      });

      document.addEventListener("click", e => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const arg = btn.getAttribute("data-arg");
        switch (action) {
          case "switch-theme":
            switchTheme(arg);
            break;
          case "toggle-gallery":
            toggleGalleryMode();
            break;
          case "preview-preset":
            setPreviewPreset(arg);
            break;
          case "toggle-pair-drawer":
            togglePairDrawer();
            break;
          case "toggle-auto-sync":
            toggleAutoSync();
            break;
          case "toggle-autostart":
            toggleAutostart();
            break;
          case "select-peer":
            selectPreferredPeer(arg);
            break;
          case "check-update":
            checkUpdateNow();
            break;
          case "install-update":
            installUpdateNow();
            break;
          case "manual-pull":
            manualPullNow();
            break;
          case "push-clipboard":
            pushClipboardToPhone();
            break;
          case "submit-pair":
            submitPairCode(arg);
            break;
          case "close-window":
            invokeTauri("hide_main_window");
            break;
        }
      });

      if (!isTauri) {
        document.body.classList.add("is-browser-preview");
        galleryMode = true;
        render();
      } else {
        render();
        refreshState();
        setInterval(refreshState, 2000);
      }
    }
  </script>
</body>
</html>
