[package]
name = "wepaste"
version = "0.1.0"
description = "WeType cross-device clipboard companion for macOS and Windows"
authors = ["xueshi.me"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
vendored-openssl = ["wx-ime-sdk/vendored-openssl"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wx-ime-sdk = { workspace = true }
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = "0.4"
tempfile = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }

