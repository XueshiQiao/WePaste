name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        uses: arduino/setup-protoc@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run protocol & SDK unit tests
        run: cargo test -p wx-ime-protocol -p wx-ime-sdk --features vendored-openssl

      - name: Check full Tauri workspace (with vendored OpenSSL)
        run: cargo check --workspace --features wepaste/vendored-openssl
