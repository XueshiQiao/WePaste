name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # ─── macOS Build (Apple Silicon + Intel) ───────────────────
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            os: macos-latest
          - target: x86_64-apple-darwin
            arch: x64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Protobuf Compiler (protoc)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Import Apple Certificate (optional)
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Tauri App (macOS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            python3 -c '
          import json
          p = "src-tauri/tauri.conf.json"
          with open(p) as f: c = json.load(f)
          c.get("bundle", {})["createUpdaterArtifacts"] = False
          with open(p, "w") as f: json.dump(c, f, indent=2)
          '
          fi
          # If APPLE_SIGNING_IDENTITY is empty, unset it so Tauri CLI auto-detects the identity from the imported keychain / APPLE_CERTIFICATE
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_SIGNING_IDENTITY
          fi
          npx tauri build --target ${{ matrix.target }} --features vendored-openssl

      - name: Upload macOS DMG & Updater Bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # ─── Windows Build (x64 + ARM64) ───────────────────────────
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Protobuf Compiler (protoc)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Build Tauri App (Windows)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            python -c "import json; p='src-tauri/tauri.conf.json'; c=json.load(open(p)); c.get('bundle',{})['createUpdaterArtifacts']=False; json.dump(c,open(p,'w'),indent=2)"
          }
          npx tauri build --target ${{ matrix.target }} --features vendored-openssl

      - name: Upload Windows NSIS / MSI & Updater Bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip
            target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip.sig
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/msi/*.msi.sig

  # ─── Create GitHub Release + Updater latest.json ───────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Updater Manifest (latest.json)
        id: prep
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          mkdir -p release-assets

          # Copy macOS Silicon (aarch64)
          for f in artifacts/macos-aarch64-apple-darwin/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_macos_aarch64.dmg"
          done
          for f in artifacts/macos-aarch64-apple-darwin/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_macos_aarch64.app.tar.gz"
          done
          for f in artifacts/macos-aarch64-apple-darwin/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_macos_aarch64.app.tar.gz.sig"
          done

          # Copy macOS Intel (x86_64)
          for f in artifacts/macos-x86_64-apple-darwin/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_macos_x64.dmg"
          done
          for f in artifacts/macos-x86_64-apple-darwin/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_macos_x64.app.tar.gz"
          done
          for f in artifacts/macos-x86_64-apple-darwin/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_macos_x64.app.tar.gz.sig"
          done

          # Copy Windows x64
          for f in artifacts/windows-x86_64-pc-windows-msvc/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_windows_x64-setup.exe"
          done
          for f in artifacts/windows-x86_64-pc-windows-msvc/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_windows_x64-setup.exe.sig"
          done

          # Copy Windows ARM64
          for f in artifacts/windows-aarch64-pc-windows-msvc/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_windows_arm64-setup.exe"
          done
          for f in artifacts/windows-aarch64-pc-windows-msvc/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig; do
            [ -f "$f" ] && cp "$f" "release-assets/WePaste_${VERSION}_windows_arm64-setup.exe.sig"
          done

          # Generate Tauri v2 Updater latest.json if signatures exist
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MAC_ARM_SIG=""
          [ -f "release-assets/WePaste_macos_aarch64.app.tar.gz.sig" ] && MAC_ARM_SIG=$(cat "release-assets/WePaste_macos_aarch64.app.tar.gz.sig")
          MAC_X64_SIG=""
          [ -f "release-assets/WePaste_macos_x64.app.tar.gz.sig" ] && MAC_X64_SIG=$(cat "release-assets/WePaste_macos_x64.app.tar.gz.sig")
          WIN_X64_SIG=""
          [ -f "release-assets/WePaste_${VERSION}_windows_x64-setup.exe.sig" ] && WIN_X64_SIG=$(cat "release-assets/WePaste_${VERSION}_windows_x64-setup.exe.sig")
          WIN_ARM_SIG=""
          [ -f "release-assets/WePaste_${VERSION}_windows_arm64-setup.exe.sig" ] && WIN_ARM_SIG=$(cat "release-assets/WePaste_${VERSION}_windows_arm64-setup.exe.sig")

          python3 -c '
          import json, sys
          version, pub_date, repo_url, mac_arm_sig, mac_x64_sig, win_x64_sig, win_arm_sig = sys.argv[1:8]
          platforms = {}
          if mac_arm_sig:
              platforms["darwin-aarch64"] = {
                  "signature": mac_arm_sig,
                  "url": f"{repo_url}/WePaste_macos_aarch64.app.tar.gz"
              }
          if mac_x64_sig:
              platforms["darwin-x86_64"] = {
                  "signature": mac_x64_sig,
                  "url": f"{repo_url}/WePaste_macos_x64.app.tar.gz"
              }
          if win_x64_sig:
              platforms["windows-x86_64"] = {
                  "signature": win_x64_sig,
                  "url": f"{repo_url}/WePaste_{version}_windows_x64-setup.exe"
              }
          if win_arm_SIG := win_arm_sig:
              platforms["windows-aarch64"] = {
                  "signature": win_arm_SIG,
                  "url": f"{repo_url}/WePaste_{version}_windows_arm64-setup.exe"
              }
          if platforms:
              manifest = {
                  "version": version,
                  "notes": f"WePaste v{version}",
                  "pub_date": pub_date,
                  "platforms": platforms
              }
              with open("release-assets/latest.json", "w") as f:
                  json.dump(manifest, f, indent=2)
          ' "$VERSION" "$PUB_DATE" "$REPO_URL" "$MAC_ARM_SIG" "$MAC_X64_SIG" "$WIN_X64_SIG" "$WIN_ARM_SIG"

          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: WePaste ${{ steps.prep.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
